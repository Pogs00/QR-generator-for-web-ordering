<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.controls {
    max-width: 800px;
    margin: 0 auto 30px auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
}

.button-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #000;
    color: #fff;
    font-size: 14px;
}

button:hover {
    opacity: .9;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}

.card {
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);

    display: flex;
    flex-direction: column;
    align-items: center;
}

.table-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
    width: 100%;
}

.qr-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 10px 0;
}

.url {
    margin-top: 10px;
    font-size: 12px;
    word-break: break-all;
    color: #555;
    width: 100%;
    text-align: center;
}

.print-single {
    margin-top: 10px;
}

@media print {
    .controls,
    .print-single {
        display: none !important;
    }

    body {
        background: white;
        padding: 0;
    }

    .card {
        box-shadow: none;
        border: 1px solid #ccc;
        break-inside: avoid;
    }
}
</style>
</head>
<body>

<h1>QR Code Generator</h1>

<div class="controls">

    <div class="form-group">
        <label>Base URL</label>
        <input
            type="text"
            id="baseUrl"
            value="https://demo-menuxv2-cms.geniex.tech"
            placeholder="https://demo-menuxv2-cms.geniex.tech"
        >
    </div>

    <div class="form-group">
        <label>How Many Tables / QR Codes?</label>
        <input
            type="number"
            id="tableCount"
            value="10"
            min="1"
        >
    </div>

    <div class="button-group">
        <button onclick="generateQRs()">Generate QR Codes</button>
        <button onclick="window.print()">Print All</button>
    </div>

</div>

<div id="qrGrid" class="grid"></div>

<script>

function generateQRs() {

    const qrGrid = document.getElementById('qrGrid');
    qrGrid.innerHTML = '';

    let baseUrl = document.getElementById('baseUrl').value.trim();
    const tableCount = parseInt(document.getElementById('tableCount').value);

    if (!baseUrl) {
        alert('Please enter a URL');
        return;
    }

    if (!tableCount || tableCount < 1) {
        alert('Please enter a valid table count');
        return;
    }

    for (let i = 1; i <= tableCount; i++) {

        let fullUrl;

        if (baseUrl.endsWith('/')) {
            fullUrl = `${baseUrl}?tablenumber=${i}`;
        } else {
            fullUrl = `${baseUrl}/?tablenumber=${i}`;
        }

        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('div');
        title.className = 'table-title';
        title.textContent = `Table ${i}`;

        const qrContainer = document.createElement('div');
        qrContainer.className = 'qr-container';

        const urlText = document.createElement('div');
        urlText.className = 'url';
        urlText.textContent = fullUrl;

        const printBtn = document.createElement('button');
        printBtn.className = 'print-single';
        printBtn.textContent = 'Print';
        printBtn.onclick = () => printSingle(card);

        card.appendChild(title);
        card.appendChild(qrContainer);
        card.appendChild(urlText);
        card.appendChild(printBtn);

        qrGrid.appendChild(card);

        new QRCode(qrContainer, {
            text: fullUrl,
            width: 180,
            height: 180,
            correctLevel: QRCode.CorrectLevel.H
        });
    }
}

function printSingle(card) {

    const printWindow = window.open('', '_blank');

    printWindow.document.write(`
        <html>
        <head>
            <title>Print QR</title>
            <style>
                body{
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    font-family:Arial,sans-serif;
                    margin:0;
                }

                .card{
                    text-align:center;
                    padding:20px;
                }

                .print-single{
                    display:none;
                }
            </style>
        </head>
        <body>
            ${card.outerHTML}
        </body>
        </html>
    `);

    printWindow.document.close();

    setTimeout(() => {
        printWindow.print();
        printWindow.close();
    }, 500);
}

generateQRs();

</script>

</body>
</html>
